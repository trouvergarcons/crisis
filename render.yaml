services:
  - type: web
    name: crisis-command-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false
      - key: SEVERITY_WEIGHT
        value: 0.40
      - key: URGENCY_WEIGHT
        value: 0.30
      - key: PEOPLE_AT_RISK_WEIGHT
        value: 0.30
